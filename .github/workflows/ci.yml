# SR-08: secure integration pipeline. Runs on every push and pull request.
# Every third-party action is pinned to a full commit SHA (the tag is in the
# comment), so a moved or hijacked tag can't change what runs here.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read   # least privilege: jobs can only read the repo

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install pinned dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Unit tests (security requirements)
        run: python -m pytest -q
      - name: SAST (Bandit)
        run: bandit -r app seed.py run.py scripts
      - name: Known-vulnerable dependencies (pip-audit)
        run: pip-audit -r requirements.txt --strict
      - name: SBOM (CycloneDX)
        run: cyclonedx-py requirements requirements.txt -o sbom-backend.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-backend
          path: backend/sbom-backend.json

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact locked versions
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Known-vulnerable dependencies (npm audit)
        run: npm audit --audit-level=high
      - name: SBOM (CycloneDX)
        run: npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --output-file sbom-frontend.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-frontend
          path: frontend/sbom-frontend.json
